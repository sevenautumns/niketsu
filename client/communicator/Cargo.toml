[package]
name = "niketsu-communicator"
version = "0.1.0"
edition = "2024"

[dependencies]
niketsu-core.path = "../core"
niketsu-protocol.path = "../../protocol"
anyhow.workspace = true
arcstr.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1.0"
serde_bytes = "0.11"
async-trait.workspace = true
either = "1"
futures = "0.3"
enum_dispatch.workspace = true
libp2p = { workspace = true, features = [ "dcutr", "dns", "gossipsub", "identify", "noise", "ping", "relay", "tcp", "yamux", "quic", "macros", "tokio", "request-response", "cbor", "serde", "autonat", "kad", "mdns" ] }
sha256 = "1.6"
subtle = "2.6"
uuid = { version = "1.19.0", features = [ "v4", "serde", "fast-rng" ] }

[dev-dependencies]
# the codec of libp2p's request_response::cbor, to measure what goes on the wire
cbor4ii = { version = "0.3", features = [ "serde1", "use_std" ] }
niketsu-relay.path = "../../relay"
niketsu-video-server.path = "../player/video_server"
tempfile = "3.24"
tracing-subscriber.workspace = true
