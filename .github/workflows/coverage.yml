name: Coverage

on:
  push:
    branches: [main]

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
          cache-on-failure: true
          # build outputs refer to nix store paths, which change with the flake
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Run Coverage
        run: nix develop --fallback --command cargo-tarpaulin --engine llvm --skip-clean --out lcov --output-dir ./coverage
      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
