name: Branch Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    name: Move nightly tag to latest commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Run latest-tag
        uses: EndBug/latest-tag@v1
        with:
          ref: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
