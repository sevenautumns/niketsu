name: Check Actions

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    name: Check Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run Checks
        run: nix flake check --fallback

  format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run verify commands
        run: nix develop --fallback --command treefmt --fail-on-change

  test:
    name: Check Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
          cache-on-failure: true
          # build outputs refer to nix store paths, which change with the flake
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Run verify commands
        run: nix develop --fallback --command cargo nextest run

