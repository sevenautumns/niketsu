name: Build Client Action

on:
  pull_request:
    paths:
      - '.github/workflows/build-client.yml'
      - 'client/**'
      - 'protocol/**'
      - 'Cargo.*'
      - 'flake.*'
  workflow_call:

jobs:
  build:
    name: Build Client
    runs-on: ${{ matrix.target == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: 
        target:
          - aarch64-linux
          - x86_64-linux
        package:
          - niketsu-client
        isMain:
          - ${{ contains(github.ref, 'main') }}
        exclude:
          - target: aarch64-linux
            package: niketsu-client
            isMain: false
        include:
          - target: x86_64-linux
            package: niketsu-client-windows
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run build
        run: nix build .#packages.${{ matrix.target }}.${{ matrix.package }} --fallback
      - name: Rename
        if: ${{ matrix.package == 'niketsu-client-windows' }}
        run: mkdir out && cp result out/x86_64-${{ matrix.package }}.zip
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.package == 'niketsu-client-windows' }}
        with:
          name: nightly-client-windows
          path: out/*
          if-no-files-found: error
