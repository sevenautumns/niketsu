name: Build Client Action

on:
  pull_request:
    paths:
      - '.github/workflows/build-client.yml'
      - 'client/**'
      - 'protocol/**'
      - 'Cargo.*'
      - 'flake.*'
  push:
    branches: [main]

jobs:
  build:
    name: Build Client
    runs-on: ${{ matrix.target == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: 
        target:
          - aarch64-linux
          - x86_64-linux
        package:
          - niketsu-client
        isMain:
          - ${{ contains(github.ref, 'main') }}
        exclude:
          - target: aarch64-linux
            package: niketsu-client
            isMain: false
        include:
          - target: x86_64-linux
            package: niketsu-client-windows
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: niketsu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run build
        run: nix build .#packages.${{ matrix.target }}.${{ matrix.package }} --fallback
      - name: Rename
        if: ${{ matrix.package == 'niketsu-client-windows' }}
        run: mkdir out && cp result out/x86_64-${{ matrix.package }}.zip
      - name: Pre-Release
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name == 'push' && matrix.package == 'niketsu-client-windows' }}
        with:
          prerelease: true
          tag_name: nightly
          files: out/*
