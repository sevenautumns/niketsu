[workspace]
members = [
  "client", 
  "client/communicator",
  "client/core",
  "client/player/mpv",
  "client/ui/iced",
  "client/ui/ratatui",
  "protocol",
  "relay",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.49", features = [ "full" ]}
serde = { version = "1.0", features = [ "derive", "rc" ] }
serde_millis = "0.1"
url = { version = "2.5", features = [ "serde" ] }
clap = { version = "4", features = [ "derive" ] }
enum_dispatch = "0.3"
arc-swap = "1.8"
async-trait = "0.1"
arcstr = { version = "1.2", features = ["serde"] }
im = { version = "15.1", features = ["serde", "rayon"] }
once_cell = "1.21"
directories = "6.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
toml = "1.1.0"
libp2p = "0.57"
chrono = "0.4"
multiaddr = "0.19"
itertools = "0.15"
rayon = "1.11"
tui-textarea = "0.7.0"

[patch.crates-io]
tui-textarea = { git = "https://github.com/phsym/tui-textarea.git" }
